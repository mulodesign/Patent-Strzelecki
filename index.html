<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121f30"><title>Patent strzelecki – interaktywny kurs</title><style>
:root{color-scheme:dark;--bg:#0d1522;--surface:#172538;--surface2:#1d3047;--fg:#eaf1f9;--muted:#aebdd0;--accent:#5fd3b3;--border:#35485f;--warn:#ffb45b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;line-height:1.55}header{padding:22px max(20px,calc((100vw - 1080px)/2));background:#121f30;border-bottom:1px solid var(--border)}h1{font-size:clamp(24px,3.5vw,38px);margin:2px 0 5px}h2{font-size:24px;margin:0 0 12px}p{margin:8px 0 13px}.muted,small{color:var(--muted)}main{max-width:1080px;margin:25px auto;padding:0 18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 25px}.tab,.btn{border:1px solid var(--border);background:var(--surface2);color:var(--fg);padding:11px 15px;border-radius:12px;cursor:pointer;font-size:15px}.tab.active,.btn.primary{background:var(--accent);color:#09241c;border-color:var(--accent);font-weight:750}.btn:disabled{opacity:.45;cursor:not-allowed}.panel,.lesson,.question{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:12px}.stat{padding:17px;border-radius:14px;background:var(--surface2)}.stat b{display:block;font-size:27px}.pill{display:inline-block;background:#24463f;color:#a9f5de;padding:3px 10px;border-radius:30px;font-size:12px;font-weight:650;margin:0 5px 8px 0}.note{border-left:3px solid var(--accent);padding-left:13px;margin:14px 0;color:#d1e9e3}.options{display:grid;gap:9px;margin:14px 0}.option{text-align:left;background:#22354c;color:var(--fg);padding:12px;border:1px solid #405269;border-radius:10px;cursor:pointer;font-size:15px}.option.selected{border:2px solid var(--accent);background:#1e4342}.option.correct{border:2px solid #6ddeab}.option.wrong{border:2px solid #fb8c84}.result{background:#183d36;border:1px solid #38846c;padding:15px;border-radius:12px;margin-top:15px}.bad{background:#492a30;border-color:#b3666b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.progress{height:9px;border-radius:10px;background:#31435a;overflow:hidden}.progress>div{height:100%;background:var(--accent)}select,input{background:#22354c;color:white;border:1px solid var(--border);border-radius:9px;padding:10px;font-size:15px;max-width:100%}a{color:#8ae8ce}.foot{margin-top:28px;padding:14px 0;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}.hide{display:none}.big{font-size:32px;font-weight:800}.flip{min-height:170px;display:grid;place-items:center;text-align:center;cursor:pointer;background:#203e4c;border:1px solid #396a69;border-radius:16px;padding:28px;font-size:21px}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.question h3{font-size:18px;margin:8px 0}.qnum{font-size:13px;color:var(--muted)}@media(max-width:600px){header{padding:16px}main{margin:12px auto;padding:0 12px}.panel,.question,.lesson{padding:15px}.tab{padding:9px 11px;font-size:14px}}
</style></head><body><header><div class="label">KURS INTERAKTYWNY · PZSS</div><h1>Patent strzelecki 🎯</h1><p class="muted">Teoria • 100 pytań • fiszki • egzamin próbny • postępy</p></header><main><nav class="tabs" aria-label="Nawigacja"><button class="tab active" data-page="start">Start</button><button class="tab" data-page="lessons">Lekcje</button><button class="tab" data-page="study">Pytania</button><button class="tab" data-page="flash">Fiszki</button><button class="tab" data-page="exam">Egzamin</button><button class="tab" data-page="stats">Postępy</button></nav><div id="app"></div><footer class="foot">Materiał edukacyjny, nieoficjalny. Stan źródeł: 10.11.2026. Przed egzaminem sprawdź aktualne przepisy PZSS i ustawę. Instruktaż praktyczny wyłącznie z uprawnionym prowadzącym.</footer></main><script>
const BANK=[{"cat": "Prawo", "q": "Kto co do zasady wydaje pozwolenia na broń osobie cywilnej?", "options": ["Starosta", "Burmistrz", "Właściwy komendant wojewódzki Policji"], "answer": 2, "why": "Art. 9 ust. 1 ustawy."}, {"cat": "Prawo", "q": "Jaki jest podstawowy warunek uzyskania pozwolenia na broń?", "options": ["Wyłącznie członkostwo w klubie", "Brak zagrożenia oraz ważna przyczyna posiadania broni", "Zakup szafy przed wnioskiem"], "answer": 1, "why": "Art. 10 ust. 1 ustawy."}, {"cat": "Prawo", "q": "Co stanowi ważną przyczynę pozwolenia sportowego?", "options": ["Deklaracja trenowania", "Patent, licencja właściwego PZS i udokumentowane członkostwo w stowarzyszeniu strzeleckim", "Sam zakup broni"], "answer": 1, "why": "Art. 10 ust. 3 pkt 3."}, {"cat": "Prawo", "q": "W jakim terminie rejestruje się nabytą broń wymagającą rejestracji?", "options": ["14 dni", "5 dni", "30 dni"], "answer": 1, "why": "Art. 13 ust. 1."}, {"cat": "Prawo", "q": "W jakim terminie należy zgłosić utratę broni?", "options": ["Do 30 dni", "Do 7 dni", "Niezwłocznie, nie później niż 24 godziny od stwierdzenia"], "answer": 2, "why": "Art. 25 ustawy."}, {"cat": "Prawo", "q": "W jakim terminie należy zawiadomić o zmianie miejsca stałego pobytu?", "options": ["60 dni", "24 godziny", "14 dni"], "answer": 2, "why": "Art. 26 ustawy."}, {"cat": "Prawo", "q": "Czym jest noszenie broni w rozumieniu ustawy?", "options": ["Wyłącznie przejazd z bronią w samochodzie", "Tylko przemieszczanie broni w kaburze", "Każde przemieszczanie załadowanej broni przez osobę posiadającą broń"], "answer": 2, "why": "Art. 10 ust. 9."}, {"cat": "Prawo", "q": "Jaki jest co do zasady minimalny wiek dla pozwolenia na broń?", "options": ["18 lat", "16 lat", "21 lat"], "answer": 2, "why": "Art. 15 ust. 1 pkt 1; przewidziano wyjątki."}, {"cat": "Prawo", "q": "Od jakiego wieku wyjątkowo można otrzymać pozwolenie do celów sportowych na wniosek wskazanego podmiotu?", "options": ["17 lat", "18 lat", "20 lat"], "answer": 1, "why": "Art. 15 ust. 2."}, {"cat": "Prawo", "q": "Jak długo co do zasady ważne jest pozwolenie na broń?", "options": ["5 lat", "10 lat", "Bezterminowo"], "answer": 2, "why": "Art. 12 ust. 1."}, {"cat": "Prawo", "q": "Czy do posiadania broni palnej sportowej na ogół wymagane jest pozwolenie?", "options": ["Tylko do przewożenia", "Nie", "Tak"], "answer": 2, "why": "Art. 9 ust. 1."}, {"cat": "Prawo", "q": "Czy rejestracja broni następuje na podstawie dowodu jej nabycia?", "options": ["Tak", "Tylko po zawodach", "Nie, wystarczy ustne oświadczenie"], "answer": 0, "why": "Art. 13."}, {"cat": "Prawo", "q": "Czy można nabywać amunicję do broni, na którą nie ma się stosownego uprawnienia?", "options": ["Tak, gdy jest to amunicja sportowa", "Nie", "Tak, bez ograniczeń"], "answer": 1, "why": "Art. 14."}, {"cat": "Prawo", "q": "Który dokument z reguły potwierdza rejestrację broni posiadanej na pozwolenie?", "options": ["Licencja sędziowska", "Legitymacja posiadacza broni", "Legitymacja osoby dopuszczonej"], "answer": 1, "why": "Art. 13 ust. 4."}, {"cat": "Prawo", "q": "Czy użyczenie broni sportowej jest całkowicie dowolne?", "options": ["Tak, jeśli jest rozładowana", "Nie, obowiązują warunki ustawowe", "Tak, każdej osobie"], "answer": 1, "why": "Art. 28 wskazuje uprawnione osoby i rodzaje broni."}, {"cat": "Prawo", "q": "Czy broń palna rozdzielnego ładowania wytworzona przed 1885 r. oraz repliki mogą korzystać z wyjątku pozwoleniowego?", "options": ["Tak, w granicach art. 11", "Tylko po uzyskaniu licencji PZSS", "Nie, nigdy"], "answer": 0, "why": "Art. 11 pkt 10."}, {"cat": "Prawo", "q": "Czy pozwolenie sportowe samo zastępuje legitymację posiadacza broni podczas jej noszenia?", "options": ["Nie", "Tak", "Wyłącznie podczas zawodów"], "answer": 0, "why": "Posiadacz powinien mieć przy sobie odpowiednie dokumenty."}, {"cat": "Prawo", "q": "Czy istnieją podstawy ustawowe cofnięcia pozwolenia?", "options": ["Nie", "Tak", "Wyłącznie na prośbę klubu"], "answer": 1, "why": "Art. 18."}, {"cat": "Prawo", "q": "Czy zaświadczenie uprawniające do nabycia broni wydaje organ Policji?", "options": ["Tak", "Tylko PZSS", "Nie, wyłącznie sklep"], "answer": 0, "why": "Art. 12 ust. 2."}, {"cat": "Prawo", "q": "Czy posiadanie patentu zwalnia automatycznie z obowiązku uzyskania pozwolenia na własną broń sportową?", "options": ["Nie", "Tak, na 12 miesięcy", "Tak"], "answer": 0, "why": "Patent jest kwalifikacją sportową, a nie pozwoleniem na broń."}, {"cat": "Bezpieczeństwo", "q": "Jak należy traktować każdą broń, zanim osobiście sprawdzisz jej stan?", "options": ["Jak niesprawną", "Jak rozładowaną", "Jak załadowaną"], "answer": 2, "why": "Podstawowa reguła bezpieczeństwa."}, {"cat": "Bezpieczeństwo", "q": "W jakim kierunku wolno kierować lufę?", "options": ["W dowolnym kierunku, jeżeli broń rozładowana", "W bezpiecznym kierunku", "W stronę innych strzelców"], "answer": 1, "why": "Nigdy nie kieruj lufy w kierunku osób ani niebezpiecznej strefy."}, {"cat": "Bezpieczeństwo", "q": "Gdzie powinien być palec przed świadomą decyzją o oddaniu strzału?", "options": ["Na języku spustowym", "Poza kabłąkiem spustowym", "Na magazynku"], "answer": 1, "why": "Palec poza spustem aż do decyzji o strzale."}, {"cat": "Bezpieczeństwo", "q": "Co zrobić po komendzie STOP?", "options": ["Wyjść na przedpole", "Kontynuować serię", "Natychmiast przerwać ogień i postępować zgodnie z komendami"], "answer": 2, "why": "Komenda STOP wymaga natychmiastowego przerwania strzelania."}, {"cat": "Bezpieczeństwo", "q": "Kto na strzelnicy kieruje przebiegiem strzelania?", "options": ["Każdy uczestnik osobno", "Prowadzący strzelanie", "Osoba z najwyższym wynikiem"], "answer": 1, "why": "Stosuj się do poleceń prowadzącego."}, {"cat": "Bezpieczeństwo", "q": "Czy wolno samodzielnie udać się do tarcz bez polecenia?", "options": ["Tak, jeśli skończyłem", "Tak, w przerwie na ładowanie", "Nie"], "answer": 2, "why": "Wejście na przedpole wymaga zezwolenia."}, {"cat": "Bezpieczeństwo", "q": "Co zrobić, gdy zauważysz niebezpieczne zachowanie na osi?", "options": ["Przejść przed lufami", "Zignorować", "Zasygnalizować zagrożenie i doprowadzić do przerwania strzelania"], "answer": 2, "why": "Bezpieczeństwo jest nadrzędne."}, {"cat": "Bezpieczeństwo", "q": "Kiedy należy zakładać ochronniki słuchu na strzelnicy?", "options": ["Tylko przy strzelbie", "Dopiero po pierwszym strzale", "Zgodnie z zasadami strzelnicy, przed narażeniem na hałas"], "answer": 2, "why": "Ochrona słuchu to podstawowe wyposażenie."}, {"cat": "Bezpieczeństwo", "q": "Czy wolno manipulować bronią za plecami strzelców bez wyznaczonego miejsca?", "options": ["Tak, jeśli magazynek pusty", "Tak", "Nie"], "answer": 2, "why": "Manipulacje wykonuj tylko w dozwolonym miejscu i na komendę."}, {"cat": "Bezpieczeństwo", "q": "Jaka jest właściwa reakcja na niewypał?", "options": ["Natychmiast spojrzeć w lufę", "Odwrócić broń do kolegi", "Utrzymać bezpieczny kierunek, nie otwierać pochopnie i zastosować procedurę prowadzącego"], "answer": 2, "why": "Niebezpieczna sytuacja wymaga procedury i nadzoru."}, {"cat": "Bezpieczeństwo", "q": "Przed czyszczeniem broni należy przede wszystkim:", "options": ["Nacisnąć spust bez kontroli komory", "Załadować magazynek", "Sprawdzić, czy jest rozładowana"], "answer": 2, "why": "Kontrolę rozładowania wykonuje się w bezpiecznym kierunku."}, {"cat": "Bezpieczeństwo", "q": "Czy można używać amunicji nieodpowiedniej do danej broni?", "options": ["Nie", "Tak, jeśli wchodzi do komory", "Tak, tylko na treningu"], "answer": 0, "why": "Stosuj wyłącznie właściwą amunicję."}, {"cat": "Bezpieczeństwo", "q": "Co jest prawidłową podstawą otwarcia ognia na zawodach?", "options": ["Własna ocena czasu", "Komenda prowadzącego zgodna z regulaminem", "Ruch sąsiada"], "answer": 1, "why": "Nie strzelaj bez uprawnionej komendy."}, {"cat": "Bezpieczeństwo", "q": "Czy broń można pozostawić bez nadzoru na stanowisku?", "options": ["Tak", "Tak, po oddaniu strzałów", "Nie"], "answer": 2, "why": "Zabezpieczaj broń zgodnie z regulaminem i poleceniami."}, {"cat": "Bezpieczeństwo", "q": "Czy alkohol można łączyć z obsługą broni?", "options": ["Tak, po zawodach na strzelnicy", "Tak, w małej ilości", "Nie"], "answer": 2, "why": "Nie używaj broni pod wpływem alkoholu."}, {"cat": "Bezpieczeństwo", "q": "Na co trzeba zwrócić uwagę przed oddaniem strzału?", "options": ["Tylko na cel", "Na cel i to, co znajduje się za nim", "Tylko na zegar"], "answer": 1, "why": "Zawsze oceniaj bezpieczną strefę strzału."}, {"cat": "Bezpieczeństwo", "q": "Jak reagować na komendę rozładowania?", "options": ["Wykonać ją zgodnie z poleceniami i okazać stan broni do kontroli", "Schować broń", "Zostawić nabój w komorze"], "answer": 0, "why": "Postępuj ściśle według procedury."}, {"cat": "Bezpieczeństwo", "q": "Czy broń można przekazać drugiej osobie bez upewnienia się, że jest bezpieczna?", "options": ["Tak, jeśli osoba jest instruktorem", "Nie", "Tak"], "answer": 1, "why": "Przy przekazywaniu broń musi być sprawdzona i skierowana bezpiecznie."}, {"cat": "Bezpieczeństwo", "q": "Jeśli nie zrozumiałeś komendy prowadzącego, należy:", "options": ["Oddać strzał", "Zrobić to, co sąsiad", "Zapytać i nie podejmować niejasnej czynności"], "answer": 2, "why": "Dopytanie jest bezpieczniejsze niż zgadywanie."}, {"cat": "Bezpieczeństwo", "q": "Najważniejsza zasada podczas usuwania zacięcia to:", "options": ["Odwrócenie lufy w stronę innych", "Utrzymanie bezpiecznego kierunku i właściwej procedury", "Szybkość"], "answer": 1, "why": "Czynności awaryjne wykonuj pod nadzorem."}, {"cat": "Regulaminy", "q": "Ile pytań ma teoria egzaminu patentowego PZSS?", "options": ["15", "10", "20"], "answer": 1, "why": "§ 19 regulaminu patentowego od 1 lipca 2025 r."}, {"cat": "Regulaminy", "q": "Ile czasu trwa część teoretyczna?", "options": ["10 minut", "20 minut", "45 minut"], "answer": 1, "why": "§ 19 ust. 7 regulaminu."}, {"cat": "Regulaminy", "q": "Ile poprawnych odpowiedzi ogółem potrzeba w teorii?", "options": ["Wszystkie 10 bez wyjątków", "Co najmniej 9", "Co najmniej 8"], "answer": 1, "why": "§ 19 ust. 5 i 6."}, {"cat": "Regulaminy", "q": "Które pytania muszą być bezbłędne?", "options": ["Dowolne cztery", "Pierwsze cztery: prawo i bezpieczeństwo", "Ostatnie dwa"], "answer": 1, "why": "§ 19 ust. 6."}, {"cat": "Regulaminy", "q": "Ile kategorii tematycznych obejmuje teoria?", "options": ["Pięć", "Trzy", "Siedem"], "answer": 0, "why": "§ 19 ust. 1."}, {"cat": "Regulaminy", "q": "Ile pytań z każdej kategorii zawiera arkusz?", "options": ["Cztery", "Jedno", "Dwa"], "answer": 2, "why": "§ 19 ust. 1."}, {"cat": "Regulaminy", "q": "Która część egzaminu odbywa się pierwsza?", "options": ["Teoretyczna", "Praktyczna", "Losowanie broni"], "answer": 0, "why": "§ 18 i 19 regulaminu."}, {"cat": "Regulaminy", "q": "Jakie są dyscypliny patentu strzeleckiego?", "options": ["Pistolet, karabin, strzelba gładkolufowa", "Pistolet, łuk, kusza", "Karabin, airsoft, łuk"], "answer": 0, "why": "§ 2 regulaminu."}, {"cat": "Regulaminy", "q": "Czy praktyka obejmuje ocenę bezpieczeństwa?", "options": ["Tylko przy strzelbie", "Nie", "Tak"], "answer": 2, "why": "§ 20 regulaminu."}, {"cat": "Regulaminy", "q": "Czy pozytywna teoria zastępuje zaliczenie praktyki?", "options": ["Tak", "Nie", "Tak, przy pistolecie"], "answer": 1, "why": "Egzamin składa się z dwóch części."}, {"cat": "Regulaminy", "q": "Czy patent strzelecki i licencja zawodnicza PZSS to ten sam dokument?", "options": ["Nie", "Tylko w karabinie", "Tak"], "answer": 0, "why": "Patent potwierdza kwalifikacje, licencja uprawnia do współzawodnictwa."}, {"cat": "Regulaminy", "q": "Czy egzamin praktyczny dotyczy wybranych dyscyplin osobno?", "options": ["Tylko pierwszej", "Tak", "Nie"], "answer": 1, "why": "§ 20 ust. 1."}, {"cat": "Regulaminy", "q": "Kto reguluje szczegółowo zasady patentu strzeleckiego?", "options": ["Sklep z bronią", "Starosta", "PZSS w regulaminie"], "answer": 2, "why": "Regulamin PZSS."}, {"cat": "Regulaminy", "q": "Czy komendy na strzelnicy są wiążące dla strzelca?", "options": ["Tak", "Nie", "Tylko dla początkujących"], "answer": 0, "why": "Regulamin strzelnicy i zasady bezpieczeństwa."}, {"cat": "Regulaminy", "q": "Czy można zmienić stanowisko podczas strzelania bez zgody prowadzącego?", "options": ["Nie", "Tylko z rozładowaną bronią", "Tak"], "answer": 0, "why": "Wymagana jest organizacja i zgoda prowadzącego."}, {"cat": "Regulaminy", "q": "Czy na zawody sportowe wpływają przepisy danej konkurencji?", "options": ["Tylko przy zawodach międzynarodowych", "Nie", "Tak"], "answer": 2, "why": "Każda konkurencja ma szczegółowy regulamin."}, {"cat": "Regulaminy", "q": "Co należy zrobić w razie przerwania serii komendą STOP?", "options": ["Przerwać strzelanie", "Podejść do tarczy", "Dokończyć serię"], "answer": 0, "why": "Komenda STOP jest nadrzędna."}, {"cat": "Regulaminy", "q": "Czy wolno rozpocząć strzelanie przed komendą startową?", "options": ["Nie", "Tak, na treningu", "Tak, po przyjęciu postawy"], "answer": 0, "why": "Rozpoczęcie określa prowadzący."}, {"cat": "Regulaminy", "q": "Czy program praktyki obejmuje sprawdzian strzelecki?", "options": ["Tak", "Wyłącznie teorię", "Nie"], "answer": 0, "why": "§ 20."}, {"cat": "Regulaminy", "q": "Gdzie można zweryfikować obowiązującą wersję regulaminu patentowego?", "options": ["W serwisie PZSS", "Wyłącznie na forach", "Na paragonie ze sklepu"], "answer": 0, "why": "Sprawdzaj źródło pierwotne."}, {"cat": "Budowa broni", "q": "Czym jest lufa?", "options": ["Urządzenie służące do przechowywania amunicji", "Przyrząd do czyszczenia", "Element prowadzący pocisk"], "answer": 2, "why": "Lufa prowadzi pocisk w chwili strzału."}, {"cat": "Budowa broni", "q": "Do czego służy magazynek?", "options": ["Do rozpraszania huku", "Do przechowywania i podawania nabojów", "Do celowania"], "answer": 1, "why": "Magazynek zasila broń w naboje."}, {"cat": "Budowa broni", "q": "Co jest funkcją spustu?", "options": ["Inicjowanie mechanizmu oddania strzału", "Regulacja przyrządów celowniczych", "Wyrzucanie magazynka"], "answer": 0, "why": "Język spustowy uruchamia mechanizm spustowy."}, {"cat": "Budowa broni", "q": "Czym jest komora nabojowa?", "options": ["Miejscem osadzenia naboju przed strzałem", "Osłoną spustu", "Skrzynką z amunicją"], "answer": 0, "why": "Komora nabojowa mieści nabój."}, {"cat": "Budowa broni", "q": "Do czego służą przyrządy celownicze?", "options": ["Do kierowania broni na cel", "Do ładowania", "Do chłodzenia lufy"], "answer": 0, "why": "Przyrządy służą do celowania."}, {"cat": "Budowa broni", "q": "Co oznacza broń samopowtarzalna?", "options": ["Po strzale automatycznie przeładowuje, ale kolejny strzał wymaga osobnego naciśnięcia spustu", "Strzela seriami przy jednym naciśnięciu", "Wymaga ręcznego przeładowania po każdym strzale"], "answer": 0, "why": "Odróżniaj samopowtarzalną od samoczynnej."}, {"cat": "Budowa broni", "q": "Co oznacza broń powtarzalna?", "options": ["Oddaje serię strzałów", "Nie ma komory nabojowej", "Wymaga ręcznego przeładowania między strzałami"], "answer": 2, "why": "Przykładem jest typowy karabin czterotaktowy."}, {"cat": "Budowa broni", "q": "Co jest charakterystyczne dla rewolweru?", "options": ["Brak lufy", "Obrotowy bęben z komorami", "Zawsze zasilanie z magazynka pudełkowego"], "answer": 1, "why": "Bęben pełni rolę zespołu komór."}, {"cat": "Budowa broni", "q": "Jakie zadanie pełni zamek broni?", "options": ["Służy wyłącznie do celowania", "Uczestniczy w zamknięciu komory i procesie przeładowania", "Jest elementem tarczy"], "answer": 1, "why": "Funkcja zamka zależy od konstrukcji."}, {"cat": "Budowa broni", "q": "Co oznacza kaliber broni?", "options": ["Długość kolby", "Parametr nominalny związany z wymiarami przewodu lufy / amunicji", "Waga broni"], "answer": 1, "why": "Sposób oznaczenia zależy od systemu."}, {"cat": "Budowa broni", "q": "Czy amunicja bocznego i centralnego zapłonu różni się sposobem inicjowania spłonki?", "options": ["Tak", "Różni się tylko kolorem łuski", "Nie"], "answer": 0, "why": "Boczny zapłon inicjuje się na obrzeżu dna łuski, centralny w spłonce środkowej."}, {"cat": "Budowa broni", "q": "Czym jest ekstraktor (wyciąg)?", "options": ["Element wyciągający łuskę/nabój z komory", "Bezpiecznik chwytowy", "Muszka"], "answer": 0, "why": "Wyciąg współpracuje z kryzą łuski."}, {"cat": "Budowa broni", "q": "Do czego służy wyrzutnik?", "options": ["Blokuje przyrządy celownicze", "Mierzy odległość", "Pomaga usunąć łuskę z broni"], "answer": 2, "why": "Wyrzutnik uczestniczy w usuwaniu łuski."}, {"cat": "Budowa broni", "q": "Jaka jest rola bezpiecznika?", "options": ["Zastępuje zasady bezpieczeństwa", "Ograniczać ryzyko niezamierzonego strzału w granicach konstrukcji", "Służy do celowania"], "answer": 1, "why": "Bezpiecznik nie znosi podstawowych reguł bezpieczeństwa."}, {"cat": "Budowa broni", "q": "Co oznacza lufa gwintowana?", "options": ["Ma wewnętrzne bruzdy i pola nadające pociskowi ruch obrotowy", "Ma wyłącznie gładki przewód", "Jest pozbawiona przewodu"], "answer": 0, "why": "Gwint stabilizuje pocisk."}, {"cat": "Budowa broni", "q": "Jaka jest typowa cecha strzelby gładkolufowej?", "options": ["Wyłącznie amunicja bocznego zapłonu", "Brak spustu", "Gładki przewód lufy"], "answer": 2, "why": "Strzelby korzystają z właściwej amunicji śrutowej lub kulowej."}, {"cat": "Budowa broni", "q": "Czym jest szczerbinka?", "options": ["Rodzaj łuski", "Zabezpieczenie spustu", "Tylny element mechanicznych przyrządów celowniczych"], "answer": 2, "why": "Współpracuje z muszką."}, {"cat": "Budowa broni", "q": "Czym jest muszka?", "options": ["Część spłonki", "Przedni element mechanicznych przyrządów celowniczych", "Element magazynka"], "answer": 1, "why": "Przedni punkt celowniczy."}, {"cat": "Budowa broni", "q": "Jaką funkcję pełni łuska naboju?", "options": ["Łączy elementy naboju i uszczelnia komorę podczas strzału", "Jest tarczą", "Zastępuje lufę"], "answer": 0, "why": "Łuska jest elementem naboju scalonego."}, {"cat": "Budowa broni", "q": "Czy identycznie wyglądające naboje można dowolnie zamieniać?", "options": ["Tak, jeśli wchodzą do magazynka", "Nie, muszą odpowiadać oznaczeniom i konstrukcji broni", "Tak"], "answer": 1, "why": "Użycie niezgodnej amunicji jest niebezpieczne."}, {"cat": "Prawo karne", "q": "Który akt penalizuje posiadanie broni palnej lub amunicji bez wymaganego zezwolenia?", "options": ["Kodeks pracy", "Kodeks karny", "Kodeks rodzinny"], "answer": 1, "why": "Art. 263 § 2 Kodeksu karnego."}, {"cat": "Prawo karne", "q": "Czy posiadanie broni palnej bez wymaganego zezwolenia jest przestępstwem?", "options": ["Tylko podczas zawodów", "Tak", "Nie"], "answer": 1, "why": "Art. 263 § 2 KK."}, {"cat": "Prawo karne", "q": "Czy nielegalne wyrabianie broni palnej lub amunicji jest penalizowane?", "options": ["Tylko jeśli jest sprzedaż", "Nie", "Tak"], "answer": 2, "why": "Art. 263 § 1 KK."}, {"cat": "Prawo karne", "q": "Czy udostępnienie broni osobie nieuprawnionej może rodzić odpowiedzialność karną?", "options": ["Tak", "Nie", "Nigdy, jeśli osoba jest pełnoletnia"], "answer": 0, "why": "Art. 263 § 3 KK."}, {"cat": "Prawo karne", "q": "Czy nieumyślne spowodowanie utraty legalnie posiadanej broni może być przestępstwem?", "options": ["Tylko po sprzedaży", "Nie", "Tak"], "answer": 2, "why": "Art. 263 § 4 KK."}, {"cat": "Prawo karne", "q": "Czy brak wymaganej rejestracji broni może skutkować odpowiedzialnością?", "options": ["Tak", "Tylko cywilną", "Nie"], "answer": 0, "why": "Przewidziano sankcje w ustawie o broni i amunicji."}, {"cat": "Prawo karne", "q": "Czy naruszenie zasad przechowywania broni może mieć konsekwencje prawne?", "options": ["Nie", "Tylko przy kradzieży", "Tak"], "answer": 2, "why": "Art. 32 i art. 51 UoBiA oraz przesłanki cofnięcia pozwolenia."}, {"cat": "Prawo karne", "q": "Czy broń można przekazać nieuprawnionemu znajomemu do samodzielnego użycia?", "options": ["Tak, jeśli odbył jeden trening", "Tak", "Nie"], "answer": 2, "why": "Zwróć uwagę na przepisy o użyczaniu i art. 263 KK."}, {"cat": "Prawo karne", "q": "Czy legalne pozwolenie zwalnia z odpowiedzialności za nieostrożne użycie broni?", "options": ["Nie", "Tak", "Tylko poza strzelnicą"], "answer": 0, "why": "Odpowiedzialność może powstać niezależnie od pozwolenia."}, {"cat": "Prawo karne", "q": "Czy art. 263 KK dotyczy m.in. broni palnej?", "options": ["Nie", "Wyłącznie broni białej", "Tak"], "answer": 2, "why": "Przepis dotyczy broni palnej i amunicji."}, {"cat": "Prawo karne", "q": "Czy odpowiedzialność za przestępstwo i administracyjne cofnięcie pozwolenia to różne kwestie?", "options": ["Nie", "Tak", "Zawsze są tożsame"], "answer": 1, "why": "Sankcje karne i decyzje administracyjne mogą być odrębne."}, {"cat": "Prawo karne", "q": "Czy strzelanie w miejscu nieprzeznaczonym do tego może być naruszeniem przepisów?", "options": ["Nie", "Tak", "Zawsze jest dozwolone na własnej działce"], "answer": 1, "why": "Art. 45 UoBiA i przepisy o strzelnicach."}, {"cat": "Prawo karne", "q": "Czy sprzedaż broni wymagającej pozwolenia osobie nieuprawnionej jest dozwolona?", "options": ["Tak", "Tylko po spisaniu umowy", "Nie"], "answer": 2, "why": "Obrót bronią podlega ścisłym regułom."}, {"cat": "Prawo karne", "q": "Czy przypadkowy strzał może skutkować odpowiedzialnością karną?", "options": ["Tak, zależnie od okoliczności i skutków", "Nigdy", "Tylko przy broni wojskowej"], "answer": 0, "why": "Możliwa odpowiedzialność za narażenie lub spowodowanie skutków."}, {"cat": "Prawo karne", "q": "Czy posiadanie dokumentu patentu oznacza brak odpowiedzialności za naruszenie przepisów?", "options": ["Tak, przez pierwszy rok", "Nie", "Tak"], "answer": 1, "why": "Patent nie daje immunitetu."}, {"cat": "Prawo karne", "q": "Czy naruszenie regulaminu strzelnicy może zostać zgłoszone prowadzącemu?", "options": ["Tylko po zawodach", "Tak", "Nie"], "answer": 1, "why": "Zgłaszaj niebezpieczne zachowania."}, {"cat": "Prawo karne", "q": "Czy legalny zakup amunicji wymaga spełnienia przesłanek ustawowych?", "options": ["Tylko przy amunicji centralnego zapłonu", "Tak", "Nie"], "answer": 1, "why": "Art. 14 UoBiA."}, {"cat": "Prawo karne", "q": "Czy nieumyślność może mieć znaczenie dla odpowiedzialności karnej związanej z bronią?", "options": ["Nie", "Tylko przy kradzieży", "Tak"], "answer": 2, "why": "Art. 263 § 4 KK opisuje czyn nieumyślny."}, {"cat": "Prawo karne", "q": "Czy posiadanie pozwolenia usuwa obowiązek zabezpieczania broni przed dostępem nieuprawnionych?", "options": ["Tak", "Tylko podczas przewozu", "Nie"], "answer": 2, "why": "Art. 32 UoBiA."}, {"cat": "Prawo karne", "q": "Gdzie sprawdzić aktualne brzmienie art. 263 KK?", "options": ["Na legitymacji posiadacza broni", "W oficjalnym systemie aktów prawnych", "Wyłącznie na forum"], "answer": 1, "why": "Zawsze sprawdzaj źródło urzędowe."}], LESSONS=[["01", "Ustawa o broni i amunicji", "Prawo", "Najważniejsze: art. 9–10 (pozwolenia i ważna przyczyna), art. 10b (kwalifikacje sportowe), art. 11 (wyjątki), art. 12–14 (zaświadczenie, rejestracja i amunicja), art. 15–18 (przesłanki i cofnięcie), art. 25–26 (zgłoszenia), art. 32 (przechowywanie).", "Zapamiętaj: zakupioną broń rejestruje się w 5 dni; utratę zgłasza się niezwłocznie, najpóźniej w 24 godziny; zmianę miejsca stałego pobytu – w 14 dni. Zwykle wymagany wiek to 21 lat; istnieje wyjątek od 18 lat.", "https://eli.gov.pl/eli/DU/2024/485/ogl"], ["02", "Bezpieczeństwo na strzelnicy", "Bezpieczeństwo", "Traktuj broń jak załadowaną. Lufa zawsze w bezpiecznym kierunku. Palec poza spustem, dopóki nie masz zamiaru strzelać. Znaj cel i jego otoczenie. Reaguj na komendy prowadzącego.", "STOP oznacza natychmiastowe przerwanie ognia. Przy niewypale lub zacięciu nie odwracaj lufy i postępuj zgodnie z zasadami prowadzącego. Praktykę ćwicz pod nadzorem instruktora.", "https://www.pzss.org.pl/patenty-licencje/patent-strzelecki"], ["03", "Regulamin egzaminu PZSS", "Regulaminy", "Teoria: 10 pytań, pięć obszarów, po dwa pytania każdy, 20 minut. Wynik pozytywny: co najmniej 9 poprawnych, w tym wszystkie pytania 1–4 (ustawa i bezpieczeństwo).", "Praktyka obejmuje bezpieczne posługiwanie się bronią i sprawdziany w wybranych dyscyplinach: pistolet, karabin, strzelba gładkolufowa. Sprawdź szczegóły egzaminu i dokumentów na stronie PZSS.", "https://www.pzss.org.pl/assets/files/licencyjno-patentowa/regulamin-patent-strzelecki-2025.pdf"], ["04", "Budowa broni i amunicji", "Budowa broni", "Rozpoznawaj lufę, komorę nabojową, zamek, magazynek, spust, bezpiecznik, muszkę i szczerbinkę. Rozróżniaj broń samopowtarzalną, powtarzalną, rewolwer i strzelbę.", "Zrozum różnicę między amunicją bocznego i centralnego zapłonu, funkcję wyciągu i wyrzutnika oraz znaczenie dopasowania amunicji do broni.", "https://www.pzss.org.pl/patenty-licencje/patent-strzelecki"], ["05", "Prawo karne", "Prawo karne", "Szczególnie art. 263 Kodeksu karnego: nielegalne wytwarzanie lub obrót, posiadanie broni palnej lub amunicji bez wymaganego zezwolenia, udostępnienie osobie nieuprawnionej oraz nieumyślna utrata.", "Przestępstwo i naruszenie administracyjnych obowiązków posiadacza broni to nie zawsze to samo. Zwracaj uwagę na znamiona konkretnego przepisu.", "https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=WDU19970880553"], ["06", "Droga do pozwolenia sportowego", "Prawo", "Klub z licencją PZSS → szkolenie i egzamin patentowy → licencja zawodnicza → orzeczenia lekarskie i psychologiczne do pozwolenia → wniosek do właściwego WPA → decyzja i zaświadczenie na zakup → rejestracja.", "Patent i licencja mogą dawać zwolnienie z egzaminu policyjnego w zakresie sportowym, lecz same nie są pozwoleniem na posiadanie własnej broni.", "https://www.pzss.org.pl/patenty-licencje/patent-strzelecki"]], KEYS=['Prawo','Bezpieczeństwo','Regulaminy','Budowa broni','Prawo karne'];

function start(){let attempts=(saved.attempts||[]);shell(`<div class="grid"><div class="stat"><span class="label">Pytania w bazie</span><b>${BANK.length}</b>5 obszarów</div><div class="stat"><span class="label">Ostatni egzamin</span><b>${attempts.length?attempts[attempts.length-1].score+'/10':'—'}</b>${attempts.length?'Wynik: '+(attempts[attempts.length-1].passed?'zaliczony':'niezaliczony'):'Brak podejść'}</div><div class="stat"><span class="label">Zapisane błędy</span><b>${(saved.mistakes||[]).length}</b>Do ponownego przećwiczenia</div><div class="stat"><span class="label">Najlepszy wynik</span><b>${attempts.length?Math.max(...attempts.map(a=>a.score))+'/10':'—'}</b>Próbne egzaminy</div></div><section class="panel"><h2>Twój plan nauki</h2><p>1. Przeczytaj 6 krótkich lekcji. 2. Rozwiązuj pytania z wyjaśnieniami. 3. Powtarzaj trudne pytania. 4. Zdaj próbny egzamin: <b>10 pytań, 20 minut, minimum 9 prawidłowych i bezbłędne pierwsze 4.</b></p><div class="actions"><button class="btn primary" data-page="lessons">Zacznij od lekcji</button><button class="btn" data-page="study">Ćwicz pytania</button><button class="btn" data-page="exam">Egzamin próbny</button></div><p class="muted">Wszystkie 100 pytań to autorski zestaw treningowy oparty na wskazanych źródłach, nie oficjalny bank pytań PZSS. Postęp zapisuje się lokalnie na tym urządzeniu.</p></section><section class="panel"><h2>Źródła i aktualność</h2><p>Ustawa o broni i amunicji: tekst jednolity Dz.U. 2024 poz. 485, z późniejszymi zmianami (m.in. Dz.U. 2025 poz. 1795). Regulamin PZSS obowiązujący od 1 lipca 2025 r.</p><p><a href="https://eli.gov.pl/eli/DU/2024/485/ogl" target="_blank" rel="noopener">Ustawa – ELI</a> · <a href="https://www.pzss.org.pl/patenty-licencje/patent-strzelecki" target="_blank" rel="noopener">Patent PZSS</a> · <a href="https://www.pzss.org.pl/assets/files/licencyjno-patentowa/regulamin-patent-strzelecki-2025.pdf" target="_blank" rel="noopener">Regulamin patentowy</a></p></section>`)}
function lessons(){shell(`<h2>6 lekcji – teoria w pigułce</h2>${LESSONS.map(l=>`<article class="lesson"><span class="pill">Lekcja ${l[0]}</span><span class="pill">${l[2]}</span><h2>${l[1]}</h2><p>${l[3]}</p><p class="note">${l[4]}</p><a href="${l[5]}" target="_blank" rel="noopener">Sprawdź źródło ↗</a><div class="actions"><button class="btn" onclick="beginStudy('${l[2]}')">Ćwicz ten temat</button></div></article>`).join('')}`)}
function catPicker(){return `<select id="category">${['Wszystkie',...KEYS,'Tylko błędne'].map(c=>`<option ${state.filter===c?'selected':''}>${c}</option>`).join('')}</select>`}
function beginStudy(cat){state.filter=cat||'Wszystkie';let available=state.filter==='Tylko błędne'?(saved.mistakes||[]).map(id=>({...BANK[id],id})):byCat(state.filter);state.studyIds=shuffle(available.map(q=>q.id));state.studyAt=0;state.studyAnswers={};state.studyShown={};navigate('study')}
function mark(qid,correct){saved.seen=saved.seen||[];if(!saved.seen.includes(qid))saved.seen.push(qid);let m=new Set(saved.mistakes||[]);if(correct)m.delete(qid);else m.add(qid);saved.mistakes=[...m];persist()}
function study(){if(!state.studyIds.length){shell(`<section class="panel"><h2>Trening pytań</h2><p>Wybierz zagadnienie i rozpocznij naukę. Po odpowiedzi zobaczysz wyjaśnienie.</p>${catPicker()} <button class="btn primary" id="go">Start</button></section>`);document.getElementById('go').onclick=()=>beginStudy(document.getElementById('category').value);return}let i=state.studyAt,id=state.studyIds[i];if(id===undefined){shell(`<section class="panel"><h2>Koniec sesji</h2><p>Przerobione pytania: ${state.studyIds.length}. Błędne możesz przećwiczyć ponownie.</p><div class="actions"><button class="btn primary" onclick="beginStudy('Tylko błędne')">Powtórz błędne</button><button class="btn" onclick="beginStudy('Wszystkie')">Nowa sesja</button></div></section>`);return}let q=BANK[id],val=state.studyAnswers[id],shown=state.studyShown[id];shell(`<div class="top"><h2>Trening pytań</h2><span class="pill">${i+1} / ${state.studyIds.length}</span></div><div class="progress"><div style="width:${(i/state.studyIds.length)*100}%"></div></div><article class="question"><span class="pill">${q.cat}</span><h3>${esc(q.q)}</h3><div class="options">${q.options.map((o,j)=>`<button class="option ${val===j?'selected':''} ${shown?(j===q.answer?'correct':j===val?'wrong':''):''}" data-opt="${j}" ${shown?'disabled':''}>${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}</div>${shown?`<div class="result ${val===q.answer?'':'bad'}"><b>${val===q.answer?'Dobrze!':'Błędna odpowiedź.'}</b><p>${esc(q.why)}</p></div>`:''}<div class="actions">${shown?`<button class="btn primary" id="next">${i===state.studyIds.length-1?'Zakończ':'Następne pytanie →'}</button>`:'<p class="muted">Wybierz jedną odpowiedź, aby odsłonić wyjaśnienie.</p>'}</div></article><button class="btn" id="restart">Zmień kategorię</button>`);document.querySelectorAll('[data-opt]').forEach(el=>el.onclick=()=>{let a=Number(el.dataset.opt);state.studyAnswers[id]=a;state.studyShown[id]=true;mark(id,a===q.answer);study()});if(shown)document.getElementById('next').onclick=()=>{state.studyAt++;study()};document.getElementById('restart').onclick=()=>{state.studyIds=[];study()}}
function beginExam(){let ids=[];for(let cat of KEYS)ids.push(...shuffle(byCat(cat).map(q=>q.id)).slice(0,2));state.examIds=ids;state.examAnswers={};state.examStart=Date.now();state.examDone=false;state.page='exam';render()}
function exam(){if(!state.examIds.length){shell(`<section class="panel"><h2>Egzamin próbny</h2><p>10 pytań, 20 minut. Kolejność: po 2 z ustawy, bezpieczeństwa, regulaminów, budowy broni i prawa karnego. Do zdania potrzeba <b>minimum 9/10</b> oraz poprawnych odpowiedzi na pytania <b>1–4</b>.</p><p>Odpowiedzi i wyjaśnienia zobaczysz dopiero po zakończeniu.</p><button class="btn primary" id="begin">Rozpocznij egzamin</button></section>`);document.getElementById('begin').onclick=beginExam;return}if(state.examDone)return examResult();shell(`<div class="top"><h2>Egzamin próbny</h2><div class="stat"><span class="label">Pozostały czas</span><b id="clock">20:00</b></div></div><p class="muted">Odpowiedz na wszystkie pytania, potem zakończ test. Uwaga: pierwsze 4 pytania muszą być poprawne.</p>${state.examIds.map((id,i)=>{let q=BANK[id],val=state.examAnswers[i];return `<article class="question"><span class="qnum">Pytanie ${i+1}/10 · ${q.cat}</span><h3>${esc(q.q)}</h3><div class="options">${q.options.map((o,j)=>`<button class="option ${val===j?'selected':''}" data-exam="${i}" data-answer="${j}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}</div></article>`}).join('')}<div class="actions"><button class="btn primary" id="finish">Zakończ i sprawdź</button></div>`);document.querySelectorAll('[data-exam]').forEach(el=>el.onclick=()=>{state.examAnswers[Number(el.dataset.exam)]=Number(el.dataset.answer);exam()});document.getElementById('finish').onclick=finishExam;tick()}
function tick(){if(state.page!=='exam'||state.examDone||!state.examIds.length)return;let left=Math.max(0,1200-Math.floor((Date.now()-state.examStart)/1000));let el=document.getElementById('clock');if(el)el.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;if(left===0){finishExam();return}setTimeout(tick,1000)}
function finishExam(){if(state.examDone)return;state.examDone=true;let score=state.examIds.reduce((n,id,i)=>n+(state.examAnswers[i]===BANK[id].answer?1:0),0);let four=state.examIds.slice(0,4).every((id,i)=>state.examAnswers[i]===BANK[id].answer);let passed=score>=9&&four;(saved.attempts=saved.attempts||[]).push({date:new Date().toISOString(),score,passed});state.examIds.forEach((id,i)=>mark(id,state.examAnswers[i]===BANK[id].answer));persist();examResult()}
function examResult(){let score=state.examIds.reduce((n,id,i)=>n+(state.examAnswers[i]===BANK[id].answer?1:0),0),four=state.examIds.slice(0,4).every((id,i)=>state.examAnswers[i]===BANK[id].answer),passed=score>=9&&four;shell(`<section class="panel"><h2>${passed?'Egzamin zaliczony!':'Egzamin niezaliczony'}</h2><div class="big">${score}/10</div><p>${!four?'Co najmniej jeden błąd w pytaniach 1–4.':'Pierwsze cztery pytania zaliczone.'} ${score>=9?'Osiągnięty próg 9/10.':'Wynik poniżej progu 9/10.'}</p><div class="actions"><button class="btn primary" onclick="beginExam()">Nowy egzamin</button><button class="btn" onclick="beginStudy('Tylko błędne')">Powtarzaj błędy</button></div></section>${state.examIds.map((id,i)=>{let q=BANK[id],val=state.examAnswers[i],ok=val===q.answer;return `<article class="question"><span class="pill">${i+1}. ${q.cat}</span><h3>${esc(q.q)}</h3><p><b>${ok?'✓ Poprawnie':'✗ Błąd / brak odpowiedzi'}</b></p><p>Twoja odpowiedź: ${val===undefined?'brak':esc(q.options[val])}</p><p>Poprawna: <b>${esc(q.options[q.answer])}</b></p><p class="note">${esc(q.why)}</p></article>`}).join('')}`)}
function beginFlash(){state.flashIds=shuffle(BANK.map((q,i)=>i));state.flashAt=0;state.flashBack=false;flash()}
function flash(){if(!state.flashIds.length){shell(`<section class="panel"><h2>Fiszki</h2><p>Zapamiętuj odpowiedź, a potem odwróć kartę.</p><button class="btn primary" id="bflash">Rozpocznij fiszki</button></section>`);document.getElementById('bflash').onclick=beginFlash;return}let id=state.flashIds[state.flashAt],q=BANK[id];shell(`<div class="top"><h2>Fiszki</h2><span class="pill">${state.flashAt+1}/${state.flashIds.length}</span></div><div class="flip" id="flip">${state.flashBack?`<div><span class="label">Odpowiedź</span><p>${esc(q.options[q.answer])}</p><small>${esc(q.why)}</small></div>`:`<div><span class="label">Pytanie · ${q.cat}</span><p>${esc(q.q)}</p><small>Kliknij, aby odkryć</small></div>`}</div><div class="actions"><button class="btn" id="prev">← Poprzednia</button><button class="btn primary" id="flipbtn">Odwróć</button><button class="btn" id="next">Następna →</button></div>`);document.getElementById('flip').onclick=document.getElementById('flipbtn').onclick=()=>{state.flashBack=!state.flashBack;flash()};document.getElementById('prev').onclick=()=>{state.flashAt=Math.max(0,state.flashAt-1);state.flashBack=false;flash()};document.getElementById('next').onclick=()=>{state.flashAt=(state.flashAt+1)%state.flashIds.length;state.flashBack=false;flash()}}
function stats(){let a=saved.attempts||[];shell(`<section class="panel"><h2>Twoje postępy</h2><div class="grid"><div class="stat"><span class="label">Egzaminy</span><b>${a.length}</b></div><div class="stat"><span class="label">Zaliczone</span><b>${a.filter(x=>x.passed).length}</b></div><div class="stat"><span class="label">Przećwiczone pytania</span><b>${(saved.seen||[]).length}/100</b></div><div class="stat"><span class="label">Do powtórzenia</span><b>${(saved.mistakes||[]).length}</b></div></div><h3>Historia wyników</h3>${a.length?`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th align="left">Data</th><th>Wynik</th><th>Rezultat</th></tr></thead><tbody>${a.slice().reverse().map(x=>`<tr><td style="padding:9px;border-bottom:1px solid #35485f">${new Date(x.date).toLocaleString('pl-PL')}</td><td align="center">${x.score}/10</td><td align="center">${x.passed?'Zaliczony':'Nie'}</td></tr>`).join('')}</tbody></table></div>`:'<p>Brak zapisanych egzaminów.</p>'}<div class="actions"><button class="btn" onclick="beginStudy('Tylko błędne')">Powtórz błędy</button><button class="btn" id="reset">Usuń lokalny postęp</button></div></section>`);document.getElementById('reset').onclick=()=>{if(confirm('Na pewno usunąć historię wyników i zapamiętane błędy z tego urządzenia?')){saved={};persist();stats()}}}
function render(){if(state.page==='start')start();else if(state.page==='lessons')lessons();else if(state.page==='study')study();else if(state.page==='exam')exam();else if(state.page==='flash')flash();else if(state.page==='stats')stats()};render();
</script></body></html>
